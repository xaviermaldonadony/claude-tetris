<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    // Apply the saved theme before first paint to avoid a flash. Dark is the default.
    try {
      if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light';
    } catch (e) {}
  </script>
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>

    <div class="game-container">
      <aside class="panel">
        <div class="panel-section">
          <span class="label">HOLD <kbd>C</kbd></span>
          <canvas id="hold-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">ENERGY</span>
          <div id="energy-track"><div id="energy-bar"></div></div>
          <span id="energy-hint"></span>
        </div>

        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">-</span>
        </div>

        <div class="panel-section">
          <span class="label">B2B</span>
          <span class="value" id="b2b">-</span>
        </div>

        <div class="panel-section">
          <span class="label">OBJECTIVE</span>
          <span id="objective" class="objective">Classic</span>
        </div>
      </aside>

      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section" id="preview-section" hidden>
          <span class="label">UPCOMING</span>
          <canvas id="preview-canvas" width="128" height="320"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> move</li>
            <li><kbd>↑</kbd> rotate</li>
            <li><kbd>↓</kbd> soft drop</li>
            <li><kbd>Space</kbd> hard drop</li>
            <li><kbd>C</kbd><kbd>Shift</kbd> hold</li>
            <li><kbd>E</kbd> ability (full bar)</li>
            <li><kbd>1</kbd>–<kbd>4</kbd> pick ability</li>
            <li><kbd>P</kbd> pause</li>
            <li><kbd>T</kbd> toggle theme</li>
          </ul>
        </div>

        <div class="panel-section">
          <span class="label">THEME</span>
          <button id="theme-toggle" type="button" aria-label="Switch to light mode">Light mode</button>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title"></p>
        <p id="overlay-score"></p>
        <div id="name-entry" class="name-entry" hidden>
          <label for="name-input" class="hs-title">NEW HIGH SCORE · ENTER NAME</label>
          <div class="name-row">
            <input id="name-input" type="text" maxlength="12" autocomplete="off" spellcheck="false" placeholder="Name" />
            <button id="name-save-btn" type="button">Save</button>
          </div>
        </div>
        <div id="highscores" class="highscores" hidden>
          <p class="hs-title">HIGH SCORES</p>
          <ol id="hs-list" class="hs-list"></ol>
          <p id="hs-stats" class="hs-stats"></p>
          <button id="hs-reset-btn" type="button">Reset scores</button>
        </div>
        <div class="overlay-actions">
          <button id="classic-btn" type="button" hidden>Classic</button>
          <button id="challenge-btn" type="button" hidden>Challenge</button>
          <button id="next-btn" type="button" hidden>Next</button>
          <button id="restart-btn" type="button" hidden>Restart</button>
          <button id="menu-btn" type="button" hidden>Menu</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
