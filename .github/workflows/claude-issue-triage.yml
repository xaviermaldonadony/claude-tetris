name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

concurrency:
  group: triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Triage issue with Claude
        id: claude-triage
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are triaging GitHub issue #${{ github.event.issue.number }} in ${{ github.repository }}.
            This is a vanilla JS HTML5 Canvas Tetris game (files: game.js, index.html, style.css, CLAUDE.md).

            Steps:
            1. Run `gh issue view ${{ github.event.issue.number }} --json title,body,labels` to read the issue and its current labels.
            2. Run `gh label list --limit 200` to get the labels that exist in this repo. Only use these existing labels. Never create new labels.
            3. Pick 1 to 3 labels that fit the issue and add them with `gh issue edit ${{ github.event.issue.number }} --add-label "<label1>,<label2>"`. Never remove labels that are already on the issue.
            4. Read the relevant code (game.js, index.html, style.css) and write a general diagnostic of the problem. Do not edit any code. Diagnosis only.
            5. Write the diagnostic in English with these sections:
               - Summary
               - Type and severity
               - Probable cause (cite file:line references)
               - Affected files
               - Suggested steps for a fix
               - Open questions / missing information
            6. Post the diagnostic as ONE comment that is updated in place:
               - Start the comment body with the exact marker line: <!-- claude-triage -->
               - Look for an existing comment that contains that marker: `gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments --jq '.[] | select(.body | contains("<!-- claude-triage -->")) | .id' | head -n1`
               - If an id is found, update it with `gh api -X PATCH repos/${{ github.repository }}/issues/comments/<id> -f body="<body>"`.
               - If no id is found, create it with `gh issue comment ${{ github.event.issue.number }} --body "<body>"`.
               - Never post a second triage comment.
          claude_args: '--allowedTools "Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*),Bash(gh api:*),Read,Grep,Glob"'
